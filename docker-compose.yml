services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-os-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops_os
    volumes:
      - ops_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops_os"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  ops_os_pgdata:
